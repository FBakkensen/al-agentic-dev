name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: pwsh
        run: ./scripts/Validate-Json.ps1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./scripts/Validate-PowerShell.ps1

      - name: Validate skills
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Force -Scope CurrentUser
          ./scripts/Validate-Skills.ps1

      - name: Check Base plugin drift
        shell: pwsh
        run: ./scripts/Test-BasePluginDrift.ps1

  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          }
          Install-Module powershell-yaml -Force -Scope CurrentUser
          ./scripts/Invoke-Tests.ps1 -Mode Full
