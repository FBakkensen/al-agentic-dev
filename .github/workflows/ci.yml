name: CI

on:
  push:
    branches: [main, feature/copilot-first-migration]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: pwsh
        run: ./scripts/Validate-Json.ps1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./scripts/Validate-PowerShell.ps1

      - name: Validate skills
        shell: pwsh
        run: ./scripts/Validate-Skills.ps1

      - name: Check REVIEW.md is in sync with skills.instructions.md
        shell: pwsh
        run: ./scripts/Update-Review.ps1 -Check

  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          }
          $r = Invoke-Pester -Path tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
