name: Base Plugin Drift

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: base-plugin-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Base plugin skill references
        id: drift
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/Test-BasePluginDrift.ps1 *>&1 | Tee-Object -FilePath .base-plugin-drift.log
          exit $LASTEXITCODE

      - name: Update drift issue
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $failed = '${{ steps.drift.outcome }}' -ne 'success'
          $conclusion = if ($failed) { 'Failure' } else { 'Success' }
          $logPath = Join-Path $PWD '.base-plugin-drift.log'
          $failure = if ($failed -and (Test-Path -LiteralPath $logPath)) {
            Get-Content -LiteralPath $logPath -Raw
          } elseif ($failed) {
            'The drift check failed before output was captured.'
          } else {
            ''
          }

          ./scripts/Update-BasePluginDriftIssue.ps1 `
            -Conclusion $conclusion `
            -Failure $failure `
            -WorkflowUrl $env:WORKFLOW_URL `
            -Repository '${{ github.repository }}'

      - name: Fail on drift
        if: always() && steps.drift.outcome != 'success'
        shell: pwsh
        run: throw 'Base plugin drift check failed.'
