<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AL Kanban</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --text: #1f2328;
    --muted: #656d76; --accent: #0969da; --danger: #cf222e; --ok: #1a7f37;
    --pending: #9a6700; --stale: #6e7781;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
  header { padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-size: 15px; margin: 0; }
  header .folder { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; font-size: 11px; background: var(--card); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.done .dot { background: var(--ok); }
  .chip.blocked .dot { background: var(--danger); }
  .chip.ready .dot { background: var(--accent); }
  main { padding: 12px 14px 60px; }
  .strip-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  table.board { border-collapse: collapse; width: 100%; table-layout: fixed; }
  table.board th, table.board td { border: 1px solid var(--border); vertical-align: top; padding: 4px; }
  table.board th { background: var(--card); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 4px; }
  table.board td.lane-label { width: 110px; font-size: 11px; color: var(--muted); word-break: break-word; background: var(--card); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 4px 0; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--accent); }
  .card .tid { font-weight: 600; font-size: 12px; }
  .card .ttl { font-size: 11.5px; color: var(--text); margin-top: 2px; }
  .card .meta { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .card.done .tid::after { content: " ✓"; color: var(--ok); }
  .card.blocked { border-left: 4px solid var(--danger); }
  .flag { color: var(--danger); font-size: 10.5px; margin-top: 4px; }
  .card.unparseable { border-left: 4px solid var(--pending); background: #fff8e5; }
  button.advance { margin-top: 5px; font-size: 11px; padding: 2px 8px; border: 1px solid var(--accent); color: var(--accent); background: var(--card); border-radius: 5px; cursor: pointer; }
  button.advance:hover { background: var(--accent); color: #fff; }
  .badge { display: inline-block; font-size: 10px; border-radius: 8px; padding: 1px 7px; margin-top: 4px; }
  .badge.pending { background: #fff1c2; color: var(--pending); border: 1px solid var(--pending); }
  .badge.stale { background: #eee; color: var(--stale); border: 1px dashed var(--stale); cursor: pointer; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; background: var(--card); border-left: 1px solid var(--border); box-shadow: -4px 0 12px rgba(0,0,0,.08); padding: 16px; overflow-y: auto; display: none; }
  #drawer.open { display: block; }
  #drawer h2 { font-size: 15px; margin: 0 0 4px; }
  #drawer .close { position: absolute; top: 10px; right: 12px; cursor: pointer; border: none; background: none; font-size: 16px; color: var(--muted); }
  #drawer dl { font-size: 12px; }
  #drawer dt { color: var(--muted); margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #drawer dd { margin: 2px 0 0; }
  #drawer .blockedOn { color: var(--danger); }
  #empty { padding: 40px; text-align: center; color: var(--muted); }
  #empty code { display: block; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AL Kanban</h1>
  <span id="ops-header"></span>
  <span class="folder" id="folder"></span>
</header>
<main id="main"></main>
<div id="drawer"></div>
<script>
"use strict";
const TECH_COLUMNS = ["Ready", "Refined", "Implemented", "Refactored", "Mutated"];
const VERIFY_COLUMNS = ["Waiting on gate", "Opened by review", "Planned", "Page-scripted", "Verified"];
const STALE_MS = 5 * 60 * 1000;

// pending badges: taskId -> {command, status, phase, sentAt, stale}
const pending = new Map();
let snapshot = null;
let drawerTaskId = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function reconcilePending(tasks) {
  for (const [id, p] of pending) {
    const t = tasks.find((x) => x.id === id);
    if (t && (t.status !== p.status || t.phase !== p.phase)) pending.delete(id);
  }
}

function badgeHtml(taskId) {
  const p = pending.get(taskId);
  if (!p) return "";
  if (p.stale) return `<span class="badge stale" data-dismiss="${esc(taskId)}" title="No file change arrived — click to dismiss">stale: ${esc(p.command)}</span>`;
  return `<span class="badge pending">pending: ${esc(p.command)}</span>`;
}

function cardHtml(t) {
  const cls = ["card"];
  if (t.status === "done") cls.push("done");
  if (t.status === "blocked") cls.push("blocked");
  const flag = t.status === "blocked" && t.blockedOn
    ? `<div class="flag">⛔ ${esc(t.blockedOn)}</div>` : "";
  const adv = t.advance
    ? `<button class="advance" data-task="${esc(t.id)}" data-prompt="${esc(t.advance.prompt)}" data-skill="${esc(t.advance.skill)}">Advance → /${esc(t.advance.skill)}</button>` : "";
  return `<div class="${cls.join(" ")}" data-open="${esc(t.id)}">
    <div class="tid">${esc(t.id)}</div>
    <div class="ttl">${esc(t.title)}</div>
    <div class="meta">${esc(t.status)}${t.phase ? " · " + esc(t.phase) : ""}</div>
    ${flag}${adv}${badgeHtml(t.id)}
  </div>`;
}

function unparseableHtml(t) {
  return `<div class="card unparseable">
    <div class="tid">⚠ unparseable</div>
    <div class="ttl">${esc(t.file)}</div>
    <div class="meta">${esc(t.error)}</div>
  </div>`;
}

function stripTable(columns, tasks, lanes) {
  let html = `<table class="board"><tr><th></th>${columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
  for (const lane of lanes) {
    html += `<tr><td class="lane-label">${esc(lane)}</td>`;
    for (const col of columns) {
      const cell = tasks.filter((t) => t.slice === lane && t.column === col);
      html += `<td>${cell.map(cardHtml).join("")}</td>`;
    }
    html += "</tr>";
  }
  html += "</table>";
  return html;
}

function chipHtml(t) {
  const cls = t.status === "done" ? "done" : t.status === "blocked" ? "blocked" : "ready";
  const adv = t.advance
    ? ` <button class="advance" data-task="${esc(t.id)}" data-prompt="${esc(t.advance.prompt)}" data-skill="${esc(t.advance.skill)}">/${esc(t.advance.skill)}</button>` : "";
  return `<span class="chip ${cls}" title="${esc(t.title)}"><span class="dot"></span>${esc(t.id)} ${esc(t.kind)} · ${esc(t.status)}${adv}${badgeHtml(t.id)}</span>`;
}

function render() {
  const main = document.getElementById("main");
  const folderEl = document.getElementById("folder");
  const opsHeader = document.getElementById("ops-header");
  if (!snapshot || !snapshot.folder) {
    folderEl.textContent = "";
    opsHeader.innerHTML = "";
    const searched = (snapshot?.searched || []).map((p) => `<code>${esc(p)}</code>`).join("");
    main.innerHTML = `<div id="empty"><strong>No tasks folder found.</strong>
      <div>Looked in:</div>${searched || "<code>(nothing to search)</code>"}</div>`;
    return;
  }
  folderEl.textContent = snapshot.folder;
  const tasks = snapshot.tasks.filter((t) => !t.unparseable);
  reconcilePending(tasks);

  const tech = tasks.filter((t) => t.kind === "technical");
  const verify = tasks.filter((t) => t.kind === "verify");
  const provision = tasks.filter((t) => t.kind === "provision");
  const breaking = tasks.filter((t) => t.kind === "breaking-change");
  const unparseable = snapshot.tasks.filter((t) => t.unparseable);

  opsHeader.innerHTML = provision.map(chipHtml).join(" ");

  const techLanes = [...new Set(tech.map((t) => t.slice))];
  const verifyLanes = [...new Set(verify.map((t) => t.slice))];

  let html = `<div class="strip-title">Technical tasks</div>`;
  html += tech.length ? stripTable(TECH_COLUMNS, tech, techLanes) : `<div class="meta">none</div>`;
  html += `<div class="strip-title">Verify tasks</div>`;
  html += verify.length ? stripTable(VERIFY_COLUMNS, verify, verifyLanes) : `<div class="meta">none</div>`;
  if (breaking.length) {
    html += `<div class="strip-title">Ops</div><div>${breaking.map(chipHtml).join(" ")}</div>`;
  }
  if (unparseable.length) {
    html += `<div class="strip-title">Unparseable files</div><div>${unparseable.map(unparseableHtml).join("")}</div>`;
  }
  main.innerHTML = html;
  renderDrawer();
}

function renderDrawer() {
  const drawer = document.getElementById("drawer");
  if (!drawerTaskId || !snapshot) { drawer.classList.remove("open"); return; }
  const t = snapshot.tasks.find((x) => x.id === drawerTaskId && !x.unparseable);
  if (!t) { drawer.classList.remove("open"); drawerTaskId = null; return; }
  const dd = (v) => esc(v || "—");
  drawer.innerHTML = `
    <button class="close" data-close="1">✕</button>
    <h2>${esc(t.id)} — ${esc(t.title)}</h2>
    <dl>
      <dt>Goal</dt><dd>${dd(t.goal)}</dd>
      <dt>Status / phase</dt><dd>${dd(t.status)}${t.phase ? " · " + esc(t.phase) : ""}</dd>
      <dt>Kind / slice</dt><dd>${dd(t.kind)} · ${dd(t.slice)}</dd>
      ${t.blockedOn ? `<dt>Blocked on</dt><dd class="blockedOn">${esc(t.blockedOn)}</dd>` : ""}
      <dt>Depends on</dt><dd>${t.dependsOn.length ? t.dependsOn.map(esc).join(", ") : "—"}</dd>
      ${t.deviations.length ? `<dt>Deviations</dt><dd><ul>${t.deviations.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></dd>` : ""}
      <dt>File</dt><dd>${esc(t.file)}</dd>
    </dl>
    ${t.advance ? `<button class="advance" data-task="${esc(t.id)}" data-prompt="${esc(t.advance.prompt)}" data-skill="${esc(t.advance.skill)}">Advance → /${esc(t.advance.skill)}</button>` : ""}
    ${badgeHtml(t.id)}`;
  drawer.classList.add("open");
}

async function advance(taskId, prompt, skill) {
  const t = snapshot.tasks.find((x) => x.id === taskId);
  const res = await fetch("/advance", { method: "POST", body: JSON.stringify({ task: taskId }) });
  if (res.ok) {
    pending.set(taskId, {
      command: "/" + skill, status: t?.status, phase: t?.phase, sentAt: Date.now(), stale: false,
    });
    setTimeout(() => {
      const p = pending.get(taskId);
      if (p && !p.stale && Date.now() - p.sentAt >= STALE_MS) { p.stale = true; render(); }
    }, STALE_MS + 100);
    render();
  }
}

document.body.addEventListener("click", (e) => {
  const advBtn = e.target.closest("button.advance");
  if (advBtn) {
    e.stopPropagation();
    advance(advBtn.dataset.task, advBtn.dataset.prompt, advBtn.dataset.skill);
    return;
  }
  const dismiss = e.target.closest("[data-dismiss]");
  if (dismiss) {
    e.stopPropagation();
    pending.delete(dismiss.dataset.dismiss);
    render();
    return;
  }
  if (e.target.closest("[data-close]")) { drawerTaskId = null; renderDrawer(); return; }
  const card = e.target.closest("[data-open]");
  if (card) { drawerTaskId = card.dataset.open; renderDrawer(); }
});

async function load() {
  const res = await fetch("/data");
  snapshot = await res.json();
  render();
}

const es = new EventSource("/events");
es.addEventListener("update", (e) => {
  snapshot = JSON.parse(e.data);
  render();
});
load();
</script>
</body>
</html>
